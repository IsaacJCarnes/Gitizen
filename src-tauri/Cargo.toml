[package]
name = "gitizen"
version = "0.0.0"
description = "A desktop Git client"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary, which
# avoids a Cargo naming clash on Windows.
name = "gitizen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Mock runtime for calling commands through the real IPC layer in tests.
tauri = { version = "2", features = ["test"] }
